<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نتائج البحث</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d0d0f;color:#eee;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
h1{font-size:18px;margin:8px 0 4px}
.sub{color:#888;font-size:12px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{display:block;text-decoration:none;color:inherit;background:#17171a;border-radius:12px;overflow:hidden}
.card .thumb{position:relative;width:100%;aspect-ratio:16/10;background:#222}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.75);font-size:11px;padding:2px 6px;border-radius:6px}
.card .info{padding:8px 10px}
.t{font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.m{font-size:11px;color:#888;margin-top:4px}
.m b{color:#aaa;font-weight:600}
</style>
</head>
<body>
<h1 id="q">نتائج البحث</h1>
<div class="sub" id="count"></div>
<div class="grid" id="res"></div>

<script>
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function views(n){n=Number(n)||0;if(n>=1e6)return (n/1e6).toFixed(1)+'M';if(n>=1e3)return (n/1e3).toFixed(0)+'K';return String(n)}
window.setData=function(d){
  document.getElementById('q').textContent = 'نتائج: ' + (d.q || '');
  var items = d.items || [];
  document.getElementById('count').textContent = items.length + ' نتيجة من عدة مواقع';
  document.getElementById('res').innerHTML = items.map(function(v){
    return '<a class="card" href="'+esc(v.url)+'">'
      + '<div class="thumb"><img loading="lazy" src="'+esc(v.thumb)+'" alt="">'
      + (v.duration ? '<span class="dur">'+esc(v.duration)+'</span>' : '')
      + '</div>'
      + '<div class="info"><div class="t">'+esc(v.title)+'</div>'
      + '<div class="m"><b>'+esc(v.site||'')+'</b> · '+views(v.views)+' مشاهدة</div>'
      + '</div></a>';
  }).join('');
};
</script>
</body>
</html>
