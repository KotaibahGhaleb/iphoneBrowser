<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نتائج البحث</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0f;color:#eee;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:14px 14px 32px}
h1{font-size:17px;margin:6px 0 4px}
.sub{color:#888;font-size:12px;margin-bottom:16px}
.vid{display:block;text-decoration:none;color:#eee;background:#16161f;border:1px solid #262633;border-radius:12px;overflow:hidden;margin-bottom:14px}
.vid:active{opacity:.85}
.vid .tw{position:relative;aspect-ratio:16/9;background:#101018}
.vid img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;bottom:6px;inset-inline-end:6px;background:rgba(0,0,0,.78);font-size:12px;padding:2px 7px;border-radius:6px}
.vid .t{font-size:14px;font-weight:600;line-height:1.4;padding:10px 10px 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vid .m{font-size:12px;color:#8a8a99;padding:0 10px 12px}
.vid .m b{color:#bbb;font-weight:600}
</style>
</head>
<body>
<h1 id="q">نتائج البحث</h1>
<div class="sub" id="count"></div>
<div id="res"></div>

<script>
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function views(n){n=Number(n)||0;if(n>=1e6)return (n/1e6).toFixed(1)+'M';if(n>=1e3)return (n/1e3).toFixed(0)+'K';return String(n)}
window.setData=function(d){
  document.getElementById('q').textContent = 'نتائج: ' + (d.q || '');
  var items = d.items || [];
  document.getElementById('count').textContent = items.length + ' نتيجة من عدة مواقع';
  document.getElementById('res').innerHTML = items.map(function(v){
    return '<a class="vid" href="'+esc(v.url)+'">'
      + '<div class="tw"><img loading="lazy" src="'+esc(v.thumb)+'" alt="">'
      + (v.duration ? '<span class="dur">'+esc(v.duration)+'</span>' : '')
      + '</div>'
      + '<div class="t">'+esc(v.title)+'</div>'
      + '<div class="m"><b>'+esc(v.site||'')+'</b> · '+views(v.views)+' مشاهدة</div>'
      + '</a>';
  }).join('');
};
</script>
</body>
</html>
