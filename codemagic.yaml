workflows:
  ios-unsigned-ipa:
    name: Build unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Build app (unsigned)
        script: |
          set -eo pipefail
          xcodebuild -project Browser.xcodeproj \
            -scheme Browser \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        script: |
          mkdir -p Payload
          cp -R "DerivedData/Build/Products/Release-iphoneos/Browser.app" "Payload/Browser.app"
          zip -r Browser-unsigned.ipa Payload
    artifacts:
      - Browser-unsigned.ipa
